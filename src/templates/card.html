<!DOCTYPE html>
<!-- Generated by npm run generate. Edit src/data/cards/, not this file. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{pageTitle}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{prefix}}assets/css/card.css">
  <script src="{{prefix}}assets/js/card.js" defer></script>
</head>
<body{{bodyClass}}>
  <main class="card">
    <div class="header">
      <div class="logo-circle">
        <img src="{{prefix}}{{logo}}" alt="{{logoAlt}}">
      </div>
      <h1 class="name">{{displayName}}</h1>
      <div class="title">{{displayJob}}</div>
    </div>
    <div class="actions">
{{actions}}
    </div>
    <div class="info">
{{details}}
      <br>
      <h3>Find also on</h3>
{{social}}
      <br>
      <button class="add-to-contact" type="button" data-download-contact>Add To Contact</button>
    </div>
  </main>
{{contactFields}}
</body>
</html>
